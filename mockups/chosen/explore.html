<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #1c1c1c;
    overflow: hidden;
    color: #cfcfcf;
    font-family: VT323, monospace;
    user-select: none;
  }
  a { color: inherit; text-decoration: none; }
  :root {
    --centre: min(42vmin, 48dvh, 48vw);
    --star: min(18vmin, 160px);
    --gap: 2.4vmin;
    --orbit: calc(var(--centre) / 2 + var(--star) / 2 + var(--gap));
    --sky: min(96vmin, 100dvh, 100vw);
  }
  .sky {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .map {
    position: relative;
    width: var(--sky);
    height: var(--sky);
  }
  .readout {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, calc(-0.5 * var(--centre) - 14px));
    font-family: "Share Tech Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: #7a7a7a;
    white-space: nowrap;
    pointer-events: none;
    z-index: 4;
  }
  .centre {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--centre);
    height: var(--centre);
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .centre a, .centre img.ca {
    display: block;
    width: 100%; height: 100%;
  }
  .ca { image-rendering: pixelated; }
  .b {
    position: absolute;
    width: 24px; height: 24px;
    pointer-events: none;
  }
  .b-tl { top: -6px; left: -6px; border-top: 1px solid #cfcfcf; border-left: 1px solid #cfcfcf; }
  .b-tr { top: -6px; right: -6px; border-top: 1px solid #cfcfcf; border-right: 1px solid #cfcfcf; }
  .b-bl { bottom: -6px; left: -6px; border-bottom: 1px solid #cfcfcf; border-left: 1px solid #cfcfcf; }
  .b-br { bottom: -6px; right: -6px; border-bottom: 1px solid #cfcfcf; border-right: 1px solid #cfcfcf; }
  .star {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--star); height: var(--star);
    margin: calc(var(--star) / -2) 0 0 calc(var(--star) / -2);
    padding: 0; border: 0; background: none;
    cursor: pointer;
    transform: rotate(var(--a)) translateY(calc(-1 * var(--orbit))) rotate(calc(-1 * var(--a)));
  }
  .star img {
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  .star:hover img { outline: 1px solid #7a7a7a; outline-offset: 3px; }
  .corner {
    position: fixed;
    z-index: 20;
    display: flex;
    gap: 1px;
  }
  .tl { top: 10px; left: 10px; }
  .tr { top: 10px; right: 10px; }
  .bl { bottom: 10px; left: 10px; }
  .br { bottom: 10px; right: 10px; }
  .cell {
    width: 24px; height: 24px;
    border: 1px solid #3a3a3a;
    background: #1c1c1c;
    display: grid;
    place-items: center;
    color: #7a7a7a;
    flex: none;
  }
  a.cell:hover, .cell.ink { color: #cfcfcf; }
  .cell.hot { color: #cfcfcf; border-color: #cfcfcf; }
  .cell.data { width: 40px; font-size: 14px; letter-spacing: 0.14em; }
  .cell.d { font-size: 16px; }
  svg.ico { display: block; }
</style>
</head>
<body>
  <nav class="corner tl">
    <span class="cell ink" title="Pause">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12"><rect x="2.5" y="2" width="2.5" height="8" fill="currentColor"/><rect x="7" y="2" width="2.5" height="8" fill="currentColor"/></svg>
    </span>
    <span class="cell" title="Record">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12"><rect x="3" y="3" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    </span>
  </nav>
  <nav class="corner tr">
    <a class="cell" href="overlay.html" title="Overlay">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 4V2h2"/><path d="M8 2h2v2"/><path d="M10 8v2H8"/><path d="M4 10H2V8"/></svg>
    </a>
    <a class="cell data" href="data.html" title="DATA">DATA</a>
  </nav>
  <nav class="corner bl">
    <span class="cell ink" title="Audio on">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 4.5h2.5L7 2v8L4.5 7.5H2z" fill="currentColor" stroke="none"/><path d="M8.5 5c.7.4.7 1.6 0 2"/><path d="M10 4.2c1.2.7 1.2 2.9 0 3.6"/></svg>
    </span>
    <span class="cell" title="Load">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 2v6"/><path d="M3.5 5.5 6 8l2.5-2.5"/><path d="M2.5 10h7"/></svg>
    </span>
    <span class="cell" title="Reset">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M8.5 3.3A3.6 3.6 0 1 1 6 2.4"/><path d="M8.5 1.5v2.2H6.4"/></svg>
    </span>
  </nav>
  <nav class="corner br">
    <a class="cell hot" href="main.html" title="Settle — back to main">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="5" y="5" width="2" height="2"/><rect x="5" y="1" width="2" height="2"/><rect x="9" y="5" width="2" height="2"/><rect x="5" y="9" width="2" height="2"/><rect x="1" y="5" width="2" height="2"/></svg>
    </a>
    <span class="cell d hot" title="1st">1</span>
    <span class="cell d" title="2nd">2</span>
    <span class="cell d" title="3rd">3</span>
  </nav>

  <div class="sky">
    <div class="map">
      <div class="readout">U(add(V.b,V8.b),sub(V4.b,V8.b))&nbsp;&nbsp;1ST · X 184 · Y 91</div>
      <button class="star" type="button" style="--a: 0deg" data-src="../stills/tile-1.png" aria-label="Travel north"><img src="../stills/tile-1.png" alt="" draggable="false"></button>
      <button class="star" type="button" style="--a: 45deg" data-src="../stills/tile-2.png" aria-label="Travel northeast"><img src="../stills/tile-2.png" alt="" draggable="false"></button>
      <button class="star" type="button" style="--a: 90deg" data-src="../stills/tile-3.png" aria-label="Travel east"><img src="../stills/tile-3.png" alt="" draggable="false"></button>
      <button class="star" type="button" style="--a: 135deg" data-src="../stills/tile-4.png" aria-label="Travel southeast"><img src="../stills/tile-4.png" alt="" draggable="false"></button>
      <button class="star" type="button" style="--a: 180deg" data-src="../stills/tile-5.png" aria-label="Travel south"><img src="../stills/tile-5.png" alt="" draggable="false"></button>
      <button class="star" type="button" style="--a: 225deg" data-src="../stills/tile-6.png" aria-label="Travel southwest"><img src="../stills/tile-6.png" alt="" draggable="false"></button>
      <button class="star" type="button" style="--a: 270deg" data-src="../stills/tile-7.png" aria-label="Travel west"><img src="../stills/tile-7.png" alt="" draggable="false"></button>
      <button class="star" type="button" style="--a: 315deg" data-src="../stills/tile-8.png" aria-label="Travel northwest"><img src="../stills/tile-8.png" alt="" draggable="false"></button>
      <div class="centre">
        <span class="b b-tl"></span>
        <span class="b b-tr"></span>
        <span class="b b-bl"></span>
        <span class="b b-br"></span>
        <a href="main.html" title="Settle — return to main">
          <img class="ca" id="centre-ca" src="../stills/tile-0.png" alt="Current simulation" draggable="false">
        </a>
      </div>
    </div>
  </div>
  <script>
    const centre = document.getElementById("centre-ca");
    for (const star of document.querySelectorAll(".star")) {
      star.addEventListener("click", () => {
        const next = star.dataset.src;
        const prev = centre.getAttribute("src");
        centre.setAttribute("src", next);
        star.dataset.src = prev;
        star.querySelector("img").setAttribute("src", prev);
      });
    }
  </script>
</body>
</html>
