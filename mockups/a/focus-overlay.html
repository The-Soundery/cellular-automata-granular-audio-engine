<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #1c1c1c;
    overflow: hidden;
    color: #cfcfcf;
    font-family: 'VT323', monospace;
    user-select: none;
    cursor: default;
  }
  a { color: inherit; text-decoration: none; }
  img.ca {
    display: block;
    width: 100%; height: 100%;
    object-fit: fill;
    image-rendering: pixelated;
  }
  .field {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(calc(100vw - 72px), calc(100vh - 72px));
    height: min(calc(100vw - 72px), calc(100vh - 72px));
    border: 1px solid #3a3a3a;
    overflow: hidden;
  }
  .ovl {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    shape-rendering: crispEdges;
  }
  .ovl * {
    fill: none;
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: miter;
    stroke-linecap: square;
  }
  .calm { stroke: #c4a35a; }
  .stat { stroke: #96969b; }
  .chaos { stroke: #e64824; }
  .osc { stroke: #3782be; }
  .flow { stroke: #46af78; }
  .eq {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    line-height: 18px;
    color: #7a7a7a;
    background: #1c1c1c;
    border-top: 1px solid #3a3a3a;
    letter-spacing: 0.04em;
  }
  .corner {
    position: fixed;
    z-index: 20;
    display: flex;
    gap: 1px;
  }
  .tl { top: 10px; left: 10px; }
  .tr { top: 10px; right: 10px; }
  .bl { bottom: 10px; left: 10px; }
  .br { bottom: 10px; right: 10px; }
  .cell {
    width: 24px; height: 24px;
    border: 1px solid #3a3a3a;
    background: #1c1c1c;
    display: grid;
    place-items: center;
    color: #7a7a7a;
    flex: none;
  }
  a.cell:hover { color: #cfcfcf; }
  .cell.ink { color: #cfcfcf; }
  .cell.hot { color: #cfcfcf; border-color: #cfcfcf; }
  .cell.data {
    width: 40px;
    font-size: 14px;
    letter-spacing: 0.14em;
    padding-left: 2px;
  }
  .cell.d { font-size: 16px; }
  svg.ico { display: block; }
</style>
</head>
<body>
  <nav class="corner tl">
    <span class="cell ink" title="Pause">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.5" height="8" fill="currentColor"/><rect x="7" y="2" width="2.5" height="8" fill="currentColor"/></svg>
    </span>
    <span class="cell" title="Record">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="3" y="3" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    </span>
  </nav>
  <nav class="corner tr">
    <a class="cell hot" href="focus.html" title="Overlay">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M2 4V2h2"/><path d="M8 2h2v2"/><path d="M10 8v2H8"/><path d="M4 10H2V8"/></svg>
    </a>
    <a class="cell data" href="data.html" title="DATA">DATA</a>
  </nav>
  <nav class="corner bl">
    <span class="cell ink" title="Audio on">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M2 4.5h2.5L7 2v8L4.5 7.5H2z" fill="currentColor" stroke="none"/><path d="M8.5 5c.7.4.7 1.6 0 2"/><path d="M10 4.2c1.2.7 1.2 2.9 0 3.6"/></svg>
    </span>
    <span class="cell" title="Load">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M6 2v6"/><path d="M3.5 5.5 6 8l2.5-2.5"/><path d="M2.5 10h7"/></svg>
    </span>
    <span class="cell" title="Reset">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M8.5 3.3A3.6 3.6 0 1 1 6 2.4"/><path d="M8.5 1.5v2.2H6.4"/></svg>
    </span>
  </nav>
  <nav class="corner br">
    <a class="cell" href="explore.html" title="Explore">
      <svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="1" y="1" width="3" height="3"/><rect x="4.5" y="1" width="3" height="3"/><rect x="8" y="1" width="3" height="3"/><rect x="1" y="4.5" width="3" height="3"/><rect x="4.5" y="4.5" width="3" height="3" fill="currentColor"/><rect x="8" y="4.5" width="3" height="3"/><rect x="1" y="8" width="3" height="3"/><rect x="4.5" y="8" width="3" height="3"/><rect x="8" y="8" width="3" height="3"/></svg>
    </a>
    <span class="cell d hot" title="1st">1</span>
    <span class="cell d" title="2nd">2</span>
    <span class="cell d" title="3rd">3</span>
  </nav>

  <main class="field">
    <img class="ca" src="../stills/tile-0.png" alt="CA field">
    <svg class="ovl" viewBox="0 0 720 720" preserveAspectRatio="none" aria-hidden="true">
      <polygon class="calm" points="188,214 428,198 452,408 214,448 168,318"/>
      <polygon class="stat" points="156,22 512,16 528,108 168,118"/>
      <rect class="osc" x="16" y="44" width="60" height="608"/>
      <path class="chaos" d="M250,268 h36 v22"/>
      <path class="chaos" d="M410,252 v40 h-28"/>
      <path class="chaos" d="M438,360 h-44 v28"/>
      <path class="chaos" d="M300,430 v-32 h40"/>
      <path class="chaos" d="M198,390 l24,18 -8,26"/>
      <path class="flow" d="M420,390 L640,248" stroke-dasharray="8 5"/>
      <path class="flow" d="M624,236 640,248 622,258"/>
      <path class="calm" d="M276,292 V272 H296"/>
      <path class="calm" d="M344,272 H364 V292"/>
      <path class="calm" d="M364,348 V368 H344"/>
      <path class="calm" d="M296,368 H276 V348"/>
      <path class="calm" d="M314,320 h20 M324,310 v20"/>
      <path class="osc" d="M26,300 V280 H46"/>
      <path class="osc" d="M46,280 H66 V300"/>
      <path class="osc" d="M66,360 V380 H46"/>
      <path class="osc" d="M46,380 H26 V360"/>
      <path class="stat" d="M312,44 V24 H332"/>
      <path class="stat" d="M368,24 H388 V44"/>
      <path class="stat" d="M388,80 V100 H368"/>
      <path class="stat" d="M332,100 H312 V80"/>
      <path class="stat" d="M344,62 h20 M354,52 v20"/>
    </svg>
    <div class="eq">
      <span>U(add(V.b,V8.b),sub(V4.b,V8.b))</span>
      <span>1ST  ·  X 184  ·  Y 91</span>
    </div>
  </main>
</body>
</html>
