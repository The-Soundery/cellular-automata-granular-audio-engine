<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B · Explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #1c1c1c;
      color: #cfcfcf;
      overflow: hidden;
    }
    body {
      font-family: VT323, monospace;
      display: grid;
      place-items: center;
    }
    :root {
      --centre: min(50vmin, calc(100dvh * 0.54), calc(100vw * 0.54));
      --star: min(8vmin, 64px);
      --orbit: min(39.5vmin, calc(100dvh * 0.42), calc(100vw * 0.42));
      --sky: min(92vmin, 100dvh, 100vw);
    }
    .sky {
      position: relative;
      width: var(--sky);
      height: var(--sky);
    }
    .readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-0.5 * var(--centre) - 14px));
      font-family: "Share Tech Mono", monospace;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.06em;
      color: #7a7a7a;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
    }
    .cell {
      position: absolute;
      width: var(--centre);
      height: var(--centre);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      overflow: visible;
    }
    .ca-link {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ca {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .b {
      position: absolute;
      width: 22px;
      height: 22px;
      pointer-events: none;
    }
    .b-tl { top: -6px; left: -6px; border-top: 1px solid #cfcfcf; border-left: 1px solid #cfcfcf; }
    .b-tr { top: -6px; right: -6px; border-top: 1px solid #cfcfcf; border-right: 1px solid #cfcfcf; }
    .b-bl { bottom: -6px; left: -6px; border-bottom: 1px solid #cfcfcf; border-left: 1px solid #cfcfcf; }
    .b-br { bottom: -6px; right: -6px; border-bottom: 1px solid #cfcfcf; border-right: 1px solid #cfcfcf; }
    .corner {
      position: absolute;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 3;
    }
    .tl { top: -20px; left: 6px; }
    .tr { top: -20px; right: 6px; }
    .bl { bottom: -20px; left: 6px; }
    .br { bottom: -20px; right: 6px; }
    .ico {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      margin: 0;
      width: 14px;
      height: 14px;
      color: #7a7a7a;
      cursor: pointer;
      display: grid;
      place-items: center;
      text-decoration: none;
    }
    .ico[hidden] { display: none; }
    .ico svg { width: 13px; height: 13px; display: block; }
    .ico:hover,
    .ico.on,
    .ico[aria-pressed="true"] { color: #cfcfcf; }
    .depth {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .depth button {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      margin: 0;
      font-family: VT323, monospace;
      font-size: 13px;
      line-height: 1;
      color: #7a7a7a;
      cursor: pointer;
    }
    .depth button.on,
    .depth button:hover { color: #cfcfcf; }
    .star {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--star);
      height: var(--star);
      margin: calc(var(--star) / -2) 0 0 calc(var(--star) / -2);
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      transform: rotate(var(--a)) translateY(calc(-1 * var(--orbit))) rotate(calc(-1 * var(--a)));
    }
    .star img {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .star:hover img {
      outline: 1px solid #7a7a7a;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="sky">
    <div class="readout">U(add(V.b,V8.b),sub(V4.b,V8.b))&nbsp;&nbsp;1ST · X 184 · Y 91</div>

    <button class="star" type="button" style="--a: 0deg" aria-label="Neighbor north"><img src="../stills/tile-1.png" alt="" draggable="false" /></button>
    <button class="star" type="button" style="--a: 45deg" aria-label="Neighbor northeast"><img src="../stills/tile-2.png" alt="" draggable="false" /></button>
    <button class="star" type="button" style="--a: 90deg" aria-label="Neighbor east"><img src="../stills/tile-3.png" alt="" draggable="false" /></button>
    <button class="star" type="button" style="--a: 135deg" aria-label="Neighbor southeast"><img src="../stills/tile-4.png" alt="" draggable="false" /></button>
    <button class="star" type="button" style="--a: 180deg" aria-label="Neighbor south"><img src="../stills/tile-5.png" alt="" draggable="false" /></button>
    <button class="star" type="button" style="--a: 225deg" aria-label="Neighbor southwest"><img src="../stills/tile-6.png" alt="" draggable="false" /></button>
    <button class="star" type="button" style="--a: 270deg" aria-label="Neighbor west"><img src="../stills/tile-7.png" alt="" draggable="false" /></button>
    <button class="star" type="button" style="--a: 315deg" aria-label="Neighbor northwest"><img src="../stills/tile-8.png" alt="" draggable="false" /></button>

    <div class="cell">
      <span class="b b-tl"></span>
      <span class="b b-tr"></span>
      <span class="b b-bl"></span>
      <span class="b b-br"></span>
      <a class="ca-link" href="focus.html" aria-label="Return to focus">
        <img class="ca" src="../stills/tile-0.png" alt="Centre field" draggable="false" />
      </a>

    <nav class="corner tl" aria-label="Transport">
      <button class="ico" type="button" data-act="play" aria-label="Play" hidden>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M3 2v8l8-4z"/></svg>
      </button>
      <button class="ico on" type="button" data-act="pause" aria-label="Pause" aria-pressed="true">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M3 2h2v8H3zm4 0h2v8H7z"/></svg>
      </button>
      <button class="ico on" type="button" data-act="aud" aria-label="Audio on" aria-pressed="true">
        <svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M2 4.5h2.2L6.5 3v6L4.2 7.5H2z"/>
          <path d="M8.5 4v4M10.5 3v6"/>
        </svg>
      </button>
      <button class="ico" type="button" data-act="load" aria-label="Load audio">
        <svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M6 2v6M3.5 5.5 6 8l2.5-2.5M2 10h8"/>
        </svg>
      </button>
    </nav>

    <nav class="corner tr" aria-label="Capture">
      <button class="ico" type="button" data-act="rec" aria-label="Record" aria-pressed="false">
        <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="ico" type="button" data-act="reset" aria-label="Reset">
        <svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M9 3H3v6M3 3l4 4M8 8h2v2"/>
        </svg>
      </button>
      <a class="ico" href="focus-overlay.html" aria-label="Overlay off">
        <svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M2 4V2h2M10 4V2H8M2 8v2h2M10 8v2H8"/>
        </svg>
      </a>
    </nav>

    <nav class="corner bl" aria-label="Views">
      <a class="ico on" href="focus.html" aria-label="Explore">
        <svg viewBox="0 0 12 12" aria-hidden="true" fill="currentColor">
          <rect x="5" y="5" width="2" height="2"/>
          <rect x="5" y="1" width="2" height="2"/>
          <rect x="9" y="5" width="2" height="2"/>
          <rect x="5" y="9" width="2" height="2"/>
          <rect x="1" y="5" width="2" height="2"/>
        </svg>
      </a>
      <a class="ico" href="data.html" aria-label="DATA">
        <svg viewBox="0 0 12 12" aria-hidden="true" fill="currentColor">
          <rect x="2" y="7" width="2" height="3"/>
          <rect x="5" y="4" width="2" height="6"/>
          <rect x="8" y="2" width="2" height="8"/>
        </svg>
      </a>
    </nav>

    <div class="corner br depth" role="group" aria-label="Type-U depth">
      <button type="button" class="on" aria-pressed="true">1</button>
      <button type="button" aria-pressed="false">2</button>
      <button type="button" aria-pressed="false">3</button>
    </div>
    </div>
  </div>
  <script>
    const play = document.querySelector('[data-act="play"]');
    const pause = document.querySelector('[data-act="pause"]');
    play.addEventListener("click", () => { play.hidden = true; pause.hidden = false; pause.classList.add("on"); pause.setAttribute("aria-pressed", "true"); });
    pause.addEventListener("click", () => { pause.hidden = true; pause.classList.remove("on"); play.hidden = false; play.classList.add("on"); });
    const rec = document.querySelector('[data-act="rec"]');
    rec.addEventListener("click", () => {
      const on = rec.getAttribute("aria-pressed") !== "true";
      rec.setAttribute("aria-pressed", String(on));
      rec.classList.toggle("on", on);
      rec.querySelector("rect").setAttribute("fill", on ? "currentColor" : "none");
    });
    const aud = document.querySelector('[data-act="aud"]');
    aud.addEventListener("click", () => {
      const on = aud.getAttribute("aria-pressed") !== "true";
      aud.setAttribute("aria-pressed", String(on));
      aud.classList.toggle("on", on);
      aud.setAttribute("aria-label", on ? "Audio on" : "Audio off");
    });
    document.querySelectorAll(".depth button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".depth button").forEach((x) => {
          x.classList.toggle("on", x === b);
          x.setAttribute("aria-pressed", String(x === b));
        });
      });
    });
  </script>
</body>
</html>
